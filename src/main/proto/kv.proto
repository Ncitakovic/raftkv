syntax = "proto3";

package raftkv.v1;

option java_package = "io.github.ncitakovic.raftkv.api.v1";
option java_multiple_files = true;

// Client-facing key-value API.
//
// Milestone 1 serves every request from a single node.
// From milestone 3 on, writes are accepted only by the Raft leader;
// followers reply with FAILED_PRECONDITION and a leader hint so clients can redirect.
service KeyValue {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  // Index of the log entry that recorded this write.
  // Monotonically increasing; becomes the Raft log index in later milestones.
  uint64 index = 1;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  // True if the key existed before the delete.
  bool existed = 1;
  uint64 index = 2;
}
