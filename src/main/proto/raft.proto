syntax = "proto3";

package raftkv.v1;

option java_package = "io.github.ncitakovic.raftkv.api.v1";
option java_multiple_files = true;

// Node-to-node Raft API. Only cluster members call this service; clients use KeyValue (kv.proto).
//
// Every request and response carries a term. Whenever a node sees a term higher than its own
// currentTerm, it adopts that term and steps down to follower (Raft paper §5.1). The receiver
// persists any change to currentTerm/votedFor before it replies (see PersistentState).
service Raft {
  // Sent by a candidate to collect votes for an election (Raft paper §5.2, §5.4.1).
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // Sent by the leader to assert its leadership and, from milestone 3 on, to replicate log
  // entries (Raft paper §5.3). In milestone 2 it is only used as a heartbeat.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

message RequestVoteRequest {
  // The candidate's term (already incremented for this election).
  // Needed so the receiver can reject votes for stale elections (term < its currentTerm)
  // and step down if the candidate is ahead (term > its currentTerm).
  uint64 term = 1;

  // ID of the node asking for the vote.
  // Needed because a node may vote for at most one candidate per term; the receiver persists
  // this ID as votedFor, and repeats a grant only to the same candidate (e.g. on a retried RPC).
  string candidate_id = 2;

  // Index of the candidate's last log entry (0 if its log is empty).
  // Needed for the election restriction (§5.4.1): together with last_log_term it tells the
  // receiver whether the candidate's log is at least as up to date as its own. Without it,
  // a node missing committed entries could become leader and overwrite them.
  uint64 last_log_index = 3;

  // Term of the candidate's last log entry (0 if its log is empty).
  // Compared first: the log whose last entry has the higher term is more up to date; only when
  // the terms are equal does the longer log (higher last_log_index) win.
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  // The receiver's currentTerm after processing the request.
  // Needed so a candidate that is behind learns the newer term and steps down to follower.
  uint64 term = 1;

  // True if the receiver voted for the candidate in this term.
  // The candidate becomes leader once it holds grants from a majority (counting its own vote).
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  // The leader's current term.
  // Needed so followers can reject a deposed leader (term < their currentTerm), and so that
  // candidates and stale followers in the same or a lower term recognise the leader and step down.
  uint64 term = 1;

  // ID of the leader sending the request.
  // Needed so followers know who the leader is, and can later redirect clients to it
  // (FAILED_PRECONDITION with a leader hint, see kv.proto).
  string leader_id = 2;

  // Milestone 3 (log replication) will add, as fields 3..6:
  //   prev_log_index - index of the log entry immediately preceding the new ones
  //   prev_log_term  - term of that entry; together they form the consistency check (§5.3)
  //   entries        - log entries to store (empty for a heartbeat)
  //   leader_commit  - the leader's commitIndex, so followers know what they may apply
  // Until then, every AppendEntries is a heartbeat: it only resets the follower's
  // election timeout and propagates the leader's term.
}

message AppendEntriesResponse {
  // The receiver's currentTerm after processing the request.
  // Needed so a deposed leader learns about the newer term and steps down to follower.
  uint64 term = 1;

  // True if the receiver accepted the leader for this term.
  // In milestone 2 it is false only when the request's term is stale. From milestone 3 on it
  // is also false when the follower's log fails the prev_log_index/prev_log_term check.
  bool success = 2;
}
